[package]
name = "token_from_header"
version = "0.1.0"
edition = "2024"

[dependencies]
async-graphql = "8.0.0-rc.5"
async-graphql-axum = "8.0.0-rc.5"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
