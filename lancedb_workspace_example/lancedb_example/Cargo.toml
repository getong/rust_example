[package]
name = "lancedb_example"
version = "0.1.0"
edition = "2021"

[dependencies]
# LanceDB 的数据交换格式是 Apache Arrow (零拷贝, 与 AI 生态无缝对接)
arrow-array = "58"
arrow-schema = "58"
futures = "0.3"
# FullTextSearchQuery 类型定义在 lance-index 中 (版本需与 lancedb 锁定的 lance 一致)
lance-index = "=9.0.0"
# LanceDB: 嵌入式(serverless)向量数据库, 基于 Lance 列式存储格式
lancedb = "0.33"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
