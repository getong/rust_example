[package]
name = "axum_stream_protobuf_example"
version = "0.1.0"
edition = "2024"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = "0.8.9"
axum-streams = { version = "0.29.0", features = ["protobuf"] }
prost = "0.14.4"
prost-types = "0.14.4"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"

[build-dependencies]
prost-build = "0.14.4"
walkdir = "2.5.0"
