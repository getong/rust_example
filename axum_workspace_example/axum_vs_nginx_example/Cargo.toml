[package]
name = "axum_vs_nginx_example"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-extra = "0.12"
axum-server = "0.8.0"
futures = "0.3.34"
futures-lite = "2.6.1"
hyper = { version = "1.11.0", features = ["client", "http2"] }
hyper-util = { version = "0.1.20", features = ["client-legacy"] }
log = "0.4.33"
pin-project = "1.1.13"
pretty_env_logger = "0.5.0"
rustls-acme = { version = "0.15.4", features = ["axum"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
tokio-stream = "0.1.19"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["auth", "fs"] }
