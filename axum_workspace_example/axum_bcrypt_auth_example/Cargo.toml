[package]
name = "axum_bcrypt_auth_example"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
bcrypt = "0.19.3"
chrono = { version = "0.4.45", features = ["serde"] }
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
