[package]
name = "axum_session_sqlx_example"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9" }
axum_session = "0.21.0"
axum_session_auth = "0.21.0"
axum_session_sqlx = { version = "0.11.0", features = ["sqlite"] }
serde = "1.0.229"
sqlx = { version = "0.9.0", features = [
    "macros",
    "migrate",
    "postgres",
    "sqlite",
    "_unstable-all-types",
    "tls-rustls",
    "runtime-tokio",
] }
tokio = { version = "1.53.1", features = ["full", "tracing"] }
