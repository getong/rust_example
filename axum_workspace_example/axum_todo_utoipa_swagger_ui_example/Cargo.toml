[package]
name = "axum_todo_utoipa_swagger_ui_example"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
futures-util = { version = "0.3.34", features = ["sink", "std"] }
hyper = { version = "1.11.1", features = ["full"] }
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
utoipa = "6.0.0"
utoipa-axum = "0.3"
utoipa-rapidoc = { version = "7", features = ["axum"] }
utoipa-redoc = { version = "7", features = ["axum"] }
utoipa-scalar = { version = "0.4", features = ["axum"] }
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }
