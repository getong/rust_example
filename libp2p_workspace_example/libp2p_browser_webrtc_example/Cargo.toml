[package]
name = "libp2p_browser_webrtc_example"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
rand = "0.10.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = "0.8.9"
libp2p = { version = "0.57.0", features = ["ed25519", "macros", "ping", "tokio"] }
libp2p-webrtc = { version = "0.10.0-alpha", features = ["tokio"] }
rust-embed = { version = "8.12.0", features = [
  "include-exclude",
  "interpolate-folder-path",
] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt", "signal"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors"] }
mime_guess = "2.0.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.85"
libp2p = { version = "0.57.0", features = [
  "ed25519",
  "macros",
  "ping",
] }
libp2p-webrtc-websys = { version = "0.5" }
tracing-wasm = "0.2.1"
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "=0.4.58"
web-sys = { version = "=0.3.85", features = [
  "Document",
  "Element",
  "HtmlElement",
  "Node",
  "Response",
  "Window",
] }

[lints]
rust.unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(wasm_bindgen_unstable_test_coverage)',
] }
