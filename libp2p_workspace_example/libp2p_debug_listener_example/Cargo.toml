[package]
name = "libp2p_debug_listener_example"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
either = "1.19.0"
env_logger = "0.11.12"
futures = "0.3.34"
libp2p = { version = "0.57.1", features = [
  "full",
] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1.29.3"
void = "1.0.2"
