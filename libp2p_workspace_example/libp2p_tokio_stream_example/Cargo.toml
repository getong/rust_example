[package]
name = "libp2p_tokio_stream_example"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
libp2p = { version = "0.57.0", features = ["tokio", "quic"] }
libp2p-stream = "0.5.0-alpha"
rand = "0.8"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

