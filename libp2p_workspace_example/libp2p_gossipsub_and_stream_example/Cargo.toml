[package]
name = "libp2p_gossipsub_and_stream_example"
version = "0.1.0"
edition = "2024"

[dependencies]
either = "1.18.0"
env_logger = "0.11.11"
libp2p = { version = "0.57.0", features = [
  "full",
] }
libp2p-stream = "0.5.0-alpha"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
