[package]
name = "libp2p_chat_example"
version = "0.1.0"
edition = "2024"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
futures = "0.3.34"
libp2p = { version = "0.57.0", features = [
  "full",
] }
rocket = { version = "0.5.1", features = ["json"] }
# cookie 0.18.1 (via rocket) does not compile with time 0.3.52's Parsable API.
time = "=0.3.51"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
