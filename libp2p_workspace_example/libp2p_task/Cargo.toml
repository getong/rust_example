[package]
name = "libp2p_task"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
apalis = { version = "1.0.0-rc.9", features = ["retry"] }
apalis-core = "1.0.0-rc.9"
byteorder = "1.5.0"
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
libp2p = { version = "0.57.0", features = [
    "full",
] }
openraft = { version = "0.10.0-alpha.34", features = ["serde", "type-alias"] }
rand = "0.8"
rocksdb = "0.25.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }
