[package]
name = "hyper_server_proxy_hyper_client_example"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.33"
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "server", "http1"] }
pico-args = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
