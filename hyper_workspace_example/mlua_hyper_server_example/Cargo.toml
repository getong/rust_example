[package]
name = "mlua_hyper_server_example"
version = "0.1.0"
edition = "2021"

[dependencies]
futures = "0.3.33"
http-body-util = "0.1.4"
hyper = { version = "1", features = ["client", "server"] }
hyper-util = { version = "0.1.20", features = ["server", "client", "client-legacy", "tokio", "http1"] }
mlua = { version = "0.12.0", features = ["macros", "lua54", "async", "send", "vendored"] }
tokio = { version = "1.53.1", features = ["macros", "rt"] }
