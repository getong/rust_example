[package]
name = "wasmtime_wasip2_ability"
version = "0.1.0"
edition = "2024"

[features]
default = ["lsp"]
lsp = []

[dependencies]
anyhow = "1.0.104"
wstd = { version = "0.6.8", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
wasmtime = { version = "47.0.2", features = ["component-model", "async"] }
wasmtime-wasi = "47.0.2"
wasmtime-wasi-http = "47.0.2"
