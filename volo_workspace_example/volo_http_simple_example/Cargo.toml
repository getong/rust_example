[package]
name = "volo_http_simple_example"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-stream = "0.3.6"
bytes = "1.12.1"
faststr = "0.2.34"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.3", features = ["full"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
volo = "0.12.4"
volo-http = { version = "0.5.7", features = ["full"] }
