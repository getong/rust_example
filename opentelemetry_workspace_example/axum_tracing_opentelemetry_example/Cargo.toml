[package]
name = "axum_tracing_opentelemetry_example"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
axum-tracing-opentelemetry = "0.42.1"
init-tracing-opentelemetry = { version = "0.43.0", features = ["tracing_subscriber_ext"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-opentelemetry-instrumentation-sdk = "0.42.1"
