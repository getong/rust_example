[package]
name = "rust_rocksdb_basic_example"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
rust-rocksdb = { version = "0.52.0", default-features = false, features = [
  "bindgen-runtime",
  "multi-threaded-cf",
  "snappy",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[dev-dependencies]
tempfile = "3"
