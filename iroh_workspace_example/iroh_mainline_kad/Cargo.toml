[package]
name = "iroh_mainline_kad"
version = "0.1.0"
edition = "2024"

[features]
default = ["tls-ring"]
tls-ring = ["iroh/tls-ring"]
tls-aws-lc-rs = ["iroh/tls-aws-lc-rs"]

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
iroh = { version = "1.5.0", default-features = false, features = [
  "metrics",
  "fast-apple-datapath",
  "portmapper",
] }
iroh-blobs = "0.105.0"
iroh-gossip = "0.103.0"
mainline = "8.0.1"
n0-error = "1.0.3"
n0-future = "0.3"
postcard = { version = "1.2.0", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
