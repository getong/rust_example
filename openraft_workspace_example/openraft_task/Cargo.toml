[package]
name = "openraft_task"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
# rc.10 requires futures-timer 3.0.4, incompatible with libp2p-swarm 0.48.
apalis = { version = "=1.0.0-rc.9", features = ["retry"] }
apalis-core = "=1.0.0-rc.9"
byteorder = "1.5.0"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
openraft = { version = "0.10.0-alpha.35", features = [
  "serde",
  "type-alias",
] }
rand = "0.10"
rocksdb = "0.25.0"
serde = { version = "1.0.229", features = ["derive"] }
sonic-rs = "0.5.10"
tokio = { version = "1.53", default-features = false, features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
