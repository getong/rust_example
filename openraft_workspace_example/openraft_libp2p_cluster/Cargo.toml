[package]
name = "openraft_libp2p_cluster"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "olpc-kv"
path = "src/bin/kv.rs"

[[bin]]
name = "olpc-peer-id"
path = "src/bin/peer_id.rs"

[[bin]]
name = "olpc-status"
path = "src/bin/status.rs"

[[bin]]
name = "olpc-task"
path = "src/bin/task_client.rs"

[features]
default = ["p1-compat"]
# Runtime adaptation of WAT text and preview1 (wasm32-wasip1) core modules
# into p2 components. Builds that only ever run ready-made wasm32-wasip2
# component binaries can drop this to shed the adapter tooling
# (docs/first-wasm-optimization-review.md §8).
p1-compat = [
    "dep:wasi-preview1-component-adapter-provider",
    "dep:wat",
    "dep:wit-component",
]

[dependencies]
anyhow = "1.0.104"
arc-swap = "1"
async-trait = "0.1.91"
axum = { version = "0.8.9", default-features = false, features = [
  "http1",
  "query",
  "tokio",
] }
base64 = "0.23"
bytes = "1"
clap = { version = "4.6.4", features = ["derive"] }
console-subscriber = "0.5.0"
dotenvy = "0.15.7"
futures = "0.3.33"
graphviz-rust = "0.9.8"
  libp2p = { git = "https://github.com/libp2p/rust-libp2p", rev = "8b42b3bf45236a913aaf975f87dfd07c6e0dcf81", features = [
  "dns",
  "ed25519",
  "gossipsub",
  "gossipsub-partial-messages",
  "kad",
  "macros",
  "mdns",
  "noise",
  "ping",
  "quic",
  "request-response",
  "tcp",
  "tls",
  "tokio",
  "websocket",
  "yamux",
] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
once_cell = "1.21.4"
openraft = { version = "0.10.0-alpha.31", features = [
  "serde",
  "type-alias",
  "tokio-rt",
] }
petgraph = "0.8.3"
prost = "0.14.4"
rayon = "1.12.0"
redis = { version = "1.4.1", features = ["aio", "tokio-comp", "connection-manager"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
# Backoff delay strategies for task retries. Default `random` feature is off:
# retry jitter must be deterministic (hashed), never sampled, so raft
# re-proposals stay idempotent.
retry = { version = "2.2.0", default-features = false }
rocksdb = "0.24.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11"
sonic-rs = "0.5.8"
sqlx = { version = "0.9", default-features = false, features = [
    "chrono",
    "json",
    "macros",
    "migrate",
    "runtime-tokio",
    "sqlite-bundled",
    "time",
    "tls-rustls",
    "uuid",
  ] }
tarpc = { version = "0.37", features = ["serde1", "tokio1"] }
tokio = { version = "1.53", default-features = false, features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
  "tracing",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v7"] }
wasi-preview1-component-adapter-provider = { version = "47.0.2", optional = true }
# Pre-validation of component binaries before compilation (the validator
# wasmtime itself uses); precise diagnostics before cranelift time is spent.
wasmparser = "0.254"
# The "handler as data" execution substrate: wasm modules carried in task
# payloads run under wasmtime + WASI with a fuel budget (versions follow
# wasmtime_workspace_example). `component-model` is on by default in v46
# but declared explicitly: the component::{Component, Linker} usage must
# not break if a future version changes the default.
wasmtime = { version = "47.0.2", features = ["component-model"] }
wasmtime-wasi = "47.0.2"
wat = { version = "1.254.0", optional = true }
wit-component = { version = "0.254", optional = true }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# Snapshot wire-frame compression: ratio matters more than speed for
# multi-megabyte state machine snapshots.
zstd = "0.13"

[build-dependencies]
prost-build = "0.14.4"

[dev-dependencies]
# Mock the TaskHostOps host-function surface to test guest-mirroring logic
# without a wasm instance (wasm-optimization-v2.md §11).
mockall = "0.15"
# Property-based determinism checks for typed guests.
proptest = "1"
tempfile = "3.27.0"
tokio = { version = "1.53", default-features = false, features = ["test-util"] }
