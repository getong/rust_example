[package]
name = "openraft_libp2p_cluster"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "olpc-kv"
path = "src/bin/kv.rs"

[[bin]]
name = "olpc-peer-id"
path = "src/bin/peer_id.rs"

[[bin]]
name = "olpc-status"
path = "src/bin/status.rs"

[[bin]]
name = "olpc-task"
path = "src/bin/task_client.rs"

[dependencies]
anyhow = "1.0.103"
async-trait = "0.1.89"
base64 = "0.22"
axum = { version = "0.8.9", default-features = false, features = [
  "http1",
  "query",
  "tokio",
] }
clap = { version = "4.6.1", features = ["derive"] }
console-subscriber = "0.5.0"
futures = "0.3.32"
graphviz-rust = "0.9.8"
libp2p = { git = "https://github.com/libp2p/rust-libp2p", rev = "5f7eb900114f90394c3b4ab5473dcb3d1f6876a1", features = [
  "dns",
  "ed25519",
  "gossipsub",
  "gossipsub-partial-messages",
  "kad",
  "macros",
  "mdns",
  "noise",
  "ping",
  "quic",
  "request-response",
  "tcp",
  "tls",
  "tokio",
  "websocket",
  "yamux",
] }
once_cell = "1.21.4"
openraft = { version = "0.10.0-alpha.29", features = [
  "serde",
  "type-alias",
  "tokio-rt",
] }
petgraph = "0.8.3"
prost = "0.14.4"
redis = { version = "1.3.0", features = ["aio", "tokio-comp", "connection-manager"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rocksdb = "0.24.0"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11"
sonic-rs = "0.5.8"
sqlx = { version = "0.9", default-features = false, features = [
    "chrono",
    "json",
    "macros",
    "migrate",
    "runtime-tokio",
    "sqlite-bundled",
    "time",
    "tls-rustls",
    "uuid",
  ] }
tarpc = { version = "0.37", features = ["serde1", "tokio1"] }
tokio = { version = "1.52", default-features = false, features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
  "tracing",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.5", features = ["v7"] }
# The "handler as data" execution substrate: wasm modules carried in task
# payloads run under wasmtime + WASI with a fuel budget (versions follow
# wasmtime_workspace_example).
wasmtime = "46.0.1"
wasmtime-wasi = "46.0.1"

[build-dependencies]
prost-build = "0.14.4"

[dev-dependencies]
tempfile = "3.27.0"
