syntax = "proto3";

package libp2p_openraft_rocksdb;

message ChatMessage {
  string from = 1;
  string text = 2;
  int64 ts_unix_ms = 3;
}

message TaskAssignedMessage {
  string task_id = 1;
  string worker_id = 2;
  // Lease epoch captured at assignment; lets the worker claim directly
  // from the wake-up without re-reading the record.
  uint64 lease_epoch = 3;
}

// Periodic self-announcement published on its own gossipsub topic so every
// node can (re)register the sender in its known-nodes address book, e.g.
// after the sender crashed, was pruned, and restarted.
message NodeAnnouncement {
  string node_id = 1;
  string addr = 2;
  int64 ts_unix_ms = 3;
}
