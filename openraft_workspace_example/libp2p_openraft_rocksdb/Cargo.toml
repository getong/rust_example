[package]
name = "libp2p_openraft_rocksdb"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
axum = { version = "0.8.9", features = ["json"] }
clap = { version = "4.6.4", features = ["derive"] }
futures = "0.3.33"
kameo = { version = "0.22.2", features = ["remote"] }
libp2p = { version = "0.56", features = [
  "cbor",
  "dns",
  "gossipsub",
  "identify",
  "json",
  "kad",
  "macros",
  "mdns",
  "noise",
  "ping",
  "quic",
  "request-response",
  "serde",
  "tcp",
  "tls",
  "tokio",
  "websocket",
  "yamux",
] }
openraft = { version = "0.10.0-alpha.31", features = [
  "serde",
  "type-alias",
] }
openraft-rocksstore-crud = { path = "../rocksstore_crud" }
prost = "0.14.4"
rand = "0.10"
rocksdb = "0.24.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53", default-features = false, features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
types-kv = { path = "../types-kv" }

[[bin]]
name = "lpr-kv"
path = "src/bin/kv.rs"

[[bin]]
name = "lpr-peer-id"
path = "src/bin/peer_id.rs"

[[bin]]
name = "lpr-status"
path = "src/bin/status.rs"

[build-dependencies]
prost-build = "0.14.4"
