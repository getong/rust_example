[package]
name = "multi_raft_kv"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.33"
log-mem = { path = "../log-mem", features = [] }
openraft = { version = "0.10.0-alpha.32", default-features = false, features = [
  "serde",
  "type-alias",
] }
openraft-multi = { version = "0.10.0-alpha.32" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sm-mem = { path = "../sm-mem" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
types-kv = { path = "../types-kv" }
