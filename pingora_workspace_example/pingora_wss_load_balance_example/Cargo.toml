[package]
name = "pingora_wss_load_balance_example"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11.11"
futures-util = "0.3.32"
log = "0.4.33"
pingora-core = { version = "0.8.1", default-features = false, features = ["openssl"] }
pingora-load-balancing = { version = "0.8.1", default-features = false, features = ["openssl"] }
pingora-proxy = { version = "0.8.1", default-features = false, features = ["openssl"] }
tokio = { version = "1.52.3", features = ["full"] }
tokio-tungstenite = "0.30.0"
