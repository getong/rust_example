[package]
name = "dioxus_clean_architecture_example"
version = "0.1.0"
edition = "2024"

[dependencies]
blitz = "=0.3.0-beta.1"
dioxus = { version = "=0.8.0-alpha.0", features = ["desktop", "router"] }
dirs = "6.0.0"
rocksdb = { version = "0.24.0", default-features = false, features = ["bindgen-runtime"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.27.0"
