[package]
name = "dioxus_clean_architecture_example"
version = "0.1.0"
edition = "2024"

[dependencies]
blitz = "=0.3.0-beta.1"
blitz-dom = { version = "=0.3.0-beta.1", default-features = false, features = ["complex-scripts"] }
dioxus = { version = "=0.8.0-alpha.2", features = ["desktop", "router"] }
dirs = "7.0.0"
rocksdb = { version = "0.25.0", default-features = false, features = ["bindgen-runtime"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.27.0"
