[package]
name = "axum_dioxus_ssr_example"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
dioxus = { version = "=0.8.0-alpha.0", features = ["ssr"] }
dioxus-ssr = "=0.8.0-alpha.0"
http = "1.4.2"
tokio = { version = "1.53", features = ["full"] }
tower-http = { version = "0.7.0", features = ["fs"] }
web-sys = { version = "0.3.103", features = [
  "Document",
  "console",
  "HtmlDocument",
  "Window",
  "Event",
  "AddEventListenerOptions",
  "Navigator",
] }
