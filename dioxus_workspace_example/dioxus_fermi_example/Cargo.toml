[package]
name = "dioxus_fermi_example"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "=0.8.0-alpha.0", default-features = false, features = ["minimal", "router"] }
dioxus-router = "=0.8.0-alpha.0"
dioxus-web = "=0.8.0-alpha.0"
fermi = "0.4.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus-desktop = { version = "=0.8.0-alpha.0", default-features = false, features = ["tokio_runtime"] }

[features]
default = []
server = ["dioxus/server"]
web = ["dioxus/web"]
