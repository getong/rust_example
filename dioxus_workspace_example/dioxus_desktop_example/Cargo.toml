[package]
name = "dioxus_desktop_example"
version = "0.1.0"
edition = "2024"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "=0.8.0-alpha.0", features = ["launch", "fullstack"] }
serde = "1.0.229"

[features]
default = ["desktop"]
server = ["dioxus/server"]
desktop = ["dioxus/desktop"]
