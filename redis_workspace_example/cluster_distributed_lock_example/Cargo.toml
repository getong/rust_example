[package]
name = "cluster_distributed_lock_example"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
redis = { version = "1.8.2", features = ["cluster", "cluster-async", "aio", "tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
