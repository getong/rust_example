apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: app-db
spec:
  instances: 3
  bootstrap:
    initdb:
      database: dbname
      owner: app
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: required
    parameters:
      statement_timeout: "15000"
  storage:
    size: 10Gi
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 1Gi
