[package]
name = "redis_cache_for_sqlx_example"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "migrate", "macros"] }
redis = { version = "1.8", default-features = false, features = ["cluster-async", "tokio-rustls-comp", "streams", "script"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15"
