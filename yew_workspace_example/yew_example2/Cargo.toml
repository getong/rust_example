[package]
name = "yew_example2"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = "0.4"
strum = "0.28"
strum_macros = "0.28"
serde = "1"
serde_derive = "1"
wasm-bindgen = "0.2.129"
wasm-logger = "0.2"
wee_alloc = { version = "0.4.5", optional = true }
yew = { version = "0.23.0", features = ["csr"] }
js-sys = "0.3.106"
image = "0.25.10"


[dependencies.web-sys]
version = "0.3.106"
features = [
  'KeyboardEvent',
  'HtmlImageElement',
  'HtmlInputElement',
  'File',
  'FileList',
  'Url',
  'Element',
  'Document',
  'Element',
  'EventTarget',
  'HtmlCanvasElement',
  'HtmlElement',
  'MouseEvent',
  'Node',
  'Window',
  'CanvasRenderingContext2d',
  'ImageData',
]
