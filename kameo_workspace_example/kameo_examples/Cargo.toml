[package]
name = "kameo_examples"
version = "0.1.0"
edition = "2024"

[features]
default = ["remote", "metrics"]
remote = ["kameo/remote"]
metrics = ["kameo/metrics"]

[dependencies]
futures = "0.3.33"
kameo = "0.22.2"
kameo_actors = "0.8.1"
libp2p = { version = "0.56.0", features = ["serde"] }
metrics-exporter-prometheus = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
subsecond = "0.7.9"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
