[package]
name = "encrypt_file"
version = "0.1.0"
edition = "2024"

[features]
perf-trace = []

[lib]
bench = false

[[bench]]
name = "cli"
harness = false

[[bench]]
name = "kem_startup"
harness = false

[dependencies]
argon2 = { version = "0.6", features = ["zeroize", "parallel"] }
aws-lc-rs = "1.18.1"
inquire = "0.9.4"
zeroize = "1.9.1"
thiserror = "2.0.21"
rayon = "1.12.0"

[[bin]]
name = "encrypt"
path = "src/encrypt.rs"
bench = false

[[bin]]
name = "decrypt"
path = "src/decrypt.rs"
bench = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }
