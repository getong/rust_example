[package]
name = "custom-csv-dataset"
version = "0.1.0"
edition = "2024"

[features]
dataframe = ["dep:burn-dataset", "dep:polars"]

[dependencies]
burn = { version = "0.22.0-pre.3", features = ["default", "dataset"]  }
burn-dataset = { version = "0.22.0-pre.3", features = ["default", "dataframe"], optional = true }
csv = "1.4.0"
polars = { version = "0.55.2", features = ["csv", "temporal"], optional = true }
reqwest = { version = "0.13.5", features = ["blocking"] }
serde = { version = "1.0.229", features = ["std", "derive"] }

[[bin]]
name = "custom-csv-dataset"
path = "src/bin/custom-csv-dataset.rs"

[[bin]]
name = "dataframe-dataset"
path = "src/bin/dataframe-dataset.rs"
required-features = ["dataframe"]
