[workspace]

resolver = "3"

# Keep gpui-fast feature unification out of the gpui-pre applications.
exclude = ["entity_view_fast_example", "embed_gpui"]

members = [
  "gpui-kit-example",
  "gpui_kit_agent",
  "entity_view_example",
  "gpui_kit_design_pattern",
  "mai_ui_demo",
  "gpui_fast_example",
  "gpui_topcoat_example",
  "gpui_topcoat_example/protocol",
  # "gpui_router_example",
  # "gpui_video_player_example",
]

# Reduce debug unwind-table size while retaining symbols and panic unwinding.
[profile.dev.package.entity_view_example]
opt-level = 1
