[workspace]

resolver = "3"

# This application owns its gpui-fast compatibility patches.
exclude = ["entity_view_fast_example"]

members = [
  "gpui-kit-example", 
  "gpui_kit_agent",
 # "entity_view_example",
  "gpui_kit_design_pattern",
  "mai_ui_demo",
  "gpui_fast_example",
]

# Reduce debug unwind-table size while retaining symbols and panic unwinding.
[profile.dev.package.entity_view_example]
opt-level = 1
