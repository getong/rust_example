[package]
name = "gpui_video_player_example"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
env_logger = "0.11"
gpui = { package = "gpui-pre", version = "0.3.8", default-features = false }
gpui-pre-platform = { version = "0.3.8", features = ["font-kit"] }
gpui-video-player = { git = "https://github.com/getong/gpui-video-player", branch = "support-gpui-pre", default-features = false, features = ["gpui-pre"] }
