[package]
name = "gpui_video_player_example"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
anyhow = "1"
env_logger = "0.11"
gpui = { package = "gpui-pre", version = "0.3.9", default-features = false }
gpui-pre-platform = { version = "0.3.9", features = ["font-kit"] }
gpui-video-player = { version = "0.1.3", default-features = false, features = ["gpui-pre"] }
