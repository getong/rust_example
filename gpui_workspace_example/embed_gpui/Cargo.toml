[package]
name = "embed_gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
env_logger = "0.11"
gpui-kit = { version = "0.8.0", features = ["gpui-fast"] }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.9", default-features = false, features = [
  "font-kit",
  "wayland",
  "x11",
] }
log = "0.4"
nsh-platform-gpui = "0.1.1"
serde_json = "1"

[build-dependencies]
nsh-bundler = "=0.1.1"
nsh-js = "=0.1.1"
nsh-ui-mobile = "=0.1.1"
