[package]
name = "qdrant_load_hf_file"
version = "0.1.0"
edition = "2024"

[dependencies]
indicatif = "0.18"
npyz = { version = "0.9", features = [
  "derive",
  "complex",
  "npz",
  "arrayvec",
  "half",
] }
qdrant-client = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["full"] }
