[package]
name = "confluent_kafka_example"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
confluent-kafka = { version = "1.0", default-features = false, features = ["lz4", "webpki-roots"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
